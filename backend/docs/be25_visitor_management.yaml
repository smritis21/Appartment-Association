openapi: 3.1.0
info:
  title: Visitor Management API — BE-25
  description: 'Visitor pass issue and verification for Jains Kences Retreat. A pass is single-use: the
    first successful verification stamps entry_time and any later attempt is rejected with 409. Passes
    outside their validity window are rejected with 400.'
  version: 1.0.0
servers:
- url: http://localhost:8000/api/v1
  description: Local development server
tags:
- name: Visitors
  description: Pre-authorised visitor passes, gate verification and entry/exit logging
paths:
  /visitors/passes:
    post:
      tags:
      - Visitors
      summary: Issue a visitor pass
      operationId: issue_pass_api_v1_visitors_passes_post
      x-backlog-id: BE-25
      x-user-story: As a guard, I want endpoints so that passes, deliveries, logs and verification persist.
      description: Issues a pre-authorised visitor pass on behalf of a resident (BE-25). The record is
        created already `approved` with a unique, single-use `pass_code` valid for the given window. It
        is redeemed at the gate through `POST /visitors/passes/verify`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorPassCreate'
        required: true
      responses:
        '201':
          description: Pass issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorOut'
        '400':
          description: valid_until is not after valid_from
        '404':
          description: Resident not found
        '422':
          description: Validation error
  /visitors/passes/verify:
    post:
      tags:
      - Visitors
      summary: Verify a visitor pass at the gate
      operationId: verify_pass_api_v1_visitors_passes_verify_post
      x-backlog-id: BE-25
      x-user-story: As a guard, I want endpoints so that passes, deliveries, logs and verification persist.
      description: 'Redeems a pass code at the gate and stamps `entry_time` (BE-25). A pass is single-use:
        verifying it a second time returns 409. Verifying outside the pass''s [valid_from, valid_until]
        window returns 400.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorPassVerifyRequest'
        required: true
      responses:
        '200':
          description: Pass verified and entry logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorOut'
        '400':
          description: Pass is not yet valid or has expired
        '404':
          description: No pass found with this code
        '409':
          description: Pass has already been used
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /visitors/{visitor_id}/exit:
    put:
      tags:
      - Visitors
      summary: Log a visitor's exit
      operationId: log_exit_api_v1_visitors__visitor_id__exit_put
      x-backlog-id: BE-25
      x-user-story: As a guard, I want endpoints so that passes, deliveries, logs and verification persist.
      description: Stamps `exit_time` for a visitor who has already been logged in (BE-25). Requires a
        prior entry; a second exit call returns 409.
      parameters:
      - name: visitor_id
        in: path
        required: true
        schema:
          type: string
          title: Visitor Id
      responses:
        '200':
          description: Exit logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorOut'
        '400':
          description: No entry has been logged for this visitor yet
        '404':
          description: Visitor request not found
        '409':
          description: Exit has already been logged
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VisitorOut:
      properties:
        visitor_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Visitor Name
        purpose:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Purpose
        phone:
          anyOf:
          - type: string
            maxLength: 15
          - type: 'null'
          title: Phone
        flat_number:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Flat Number
        gate:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Gate
        vehicle:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Vehicle
        resident_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resident Id
        visitor_id:
          type: string
          title: Visitor Id
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - left_at_gate
          - expired
          title: Status
        pass_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Pass Code
        valid_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid From
        valid_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid Until
        entry_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Entry Time
        exit_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Exit Time
        decision:
          anyOf:
          - type: string
            enum:
            - approved
            - rejected
            - left_at_gate
          - type: 'null'
          title: Decision
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decided_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Decided At
        decision_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Notes
        collected_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Collected By
        pickup_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Pickup Location
        requested_at:
          type: string
          format: date-time
          title: Requested At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - visitor_name
      - visitor_id
      - status
      - requested_at
      - created_at
      - updated_at
      title: VisitorOut
    VisitorPassCreate:
      properties:
        visitor_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Visitor Name
        purpose:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Purpose
        phone:
          anyOf:
          - type: string
            maxLength: 15
          - type: 'null'
          title: Phone
        flat_number:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Flat Number
        gate:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Gate
        vehicle:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Vehicle
        resident_id:
          type: string
          title: Resident Id
          description: resident_id of the resident issuing the pass
        valid_from:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Valid From
          description: Defaults to the issue time if omitted
        valid_until:
          type: string
          format: date-time
          title: Valid Until
          description: Pass expires after this timestamp
      type: object
      required:
      - visitor_name
      - resident_id
      - valid_until
      title: VisitorPassCreate
      description: 'Request body for POST /visitors/passes.


        Unlike POST /visitors (BE-05, a guard logging a walk-in that still needs a

        resident''s decision), a pass is pre-authorised by the resident who issues

        it — resident_id is required and the record is created already approved.'
    VisitorPassVerifyRequest:
      properties:
        pass_code:
          type: string
          maxLength: 20
          minLength: 1
          title: Pass Code
        gate:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Gate
          description: Gate the pass was presented at
      type: object
      required:
      - pass_code
      title: VisitorPassVerifyRequest
      description: Request body for POST /visitors/passes/verify.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
