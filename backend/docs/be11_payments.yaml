openapi: 3.0.3
info:
  title: Payments & Billing API — BE-11
  description: |
    Payment processing and billing API for Jains Kences Retreat.

    - Bills represent what a resident owes for a given month.
    - Payments represent transactions made against a bill via the mock gateway.
    - No real card or banking details are accepted or stored.
    - Set `gateway.simulate_failure = true` to test failure handling.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

tags:
  - name: Payments & Billing
    description: Bill generation, payment processing, receipts, and payment history

paths:

  /bills:
    post:
      tags: [Payments & Billing]
      summary: Create a bill
      description: |
        Generates a maintenance bill for a resident.
        GST (18%) is auto-calculated on the taxable subtotal.
        The `resident_id` must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillCreate" }
            example:
              resident_id: "uuid-of-resident"
              billing_month: "2024-03"
              maintenance: 3000
              water: 500
              parking: 200
              miscellaneous: 100
              discount: 0
              due_date: "2024-03-31"
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillOut" }
        "404": { description: Resident not found }
        "409": { description: Duplicate bill — a bill for this resident and billing month already exists }
        "422": { description: Validation error }

    get:
      tags: [Payments & Billing]
      summary: List bills
      parameters:
        - name: resident_id
          in: query
          schema: { type: string }
          description: Filter by resident UUID
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, overdue, partially_paid] }
        - name: skip
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillSummary" }

  /bills/{bill_id}:
    get:
      tags: [Payments & Billing]
      summary: Get bill detail
      description: Returns full bill with line items, GST, total, and all associated payments.
      parameters:
        - name: bill_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillOut" }
        "404": { description: Bill not found }

  /payments:
    post:
      tags: [Payments & Billing]
      summary: Process a payment
      description: |
        Processes a payment against an existing bill via the mock gateway.
        Returns a receipt with `receipt_no` (PAY-YYYYMMDD-XXXXXXXX) and `transaction_ref`.
        Set `gateway.simulate_failure = true` to test failure handling.
        **No real card or banking details are accepted or stored.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreate" }
            example:
              bill_id: "uuid-of-bill"
              amount_paid: 4484.00
              payment_method: "upi"
              gateway:
                mock_reference: "resident@mockupi"
                simulate_failure: false
      responses:
        "201":
          description: Payment successful — receipt returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentReceipt" }
        "400": { description: Bill already paid, cancelled, or overpayment attempted }
        "402": { description: Gateway declined or timed out }
        "404": { description: Bill not found }
        "422": { description: Validation error }

  /payments/resident/{resident_id}:
    get:
      tags: [Payments & Billing]
      summary: Payment history for a resident
      parameters:
        - name: resident_id
          in: path
          required: true
          schema: { type: string }
        - name: skip
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentOut" }

  /payments/{payment_id}:
    get:
      tags: [Payments & Billing]
      summary: Get payment / receipt
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOut" }
        "404": { description: Payment not found }

components:
  schemas:

    BillCreate:
      type: object
      required: [resident_id, billing_month, due_date]
      properties:
        resident_id:   { type: string }
        billing_month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2024-03" }
        maintenance:   { type: number, minimum: 0, default: 0 }
        water:         { type: number, minimum: 0, default: 0 }
        parking:       { type: number, minimum: 0, default: 0 }
        miscellaneous: { type: number, minimum: 0, default: 0 }
        discount:      { type: number, minimum: 0, default: 0 }
        due_date:      { type: string, format: date }

    BillSummary:
      type: object
      properties:
        bill_id:       { type: string }
        resident_id:   { type: string }
        billing_month: { type: string }
        total_amount:  { type: number }
        due_date:      { type: string, format: date }
        status:        { type: string, enum: [pending, paid, overdue, partially_paid] }

    BillOut:
      type: object
      properties:
        bill_id:       { type: string }
        resident_id:   { type: string }
        billing_month: { type: string }
        maintenance:   { type: number }
        water:         { type: number }
        parking:       { type: number }
        miscellaneous: { type: number }
        discount:      { type: number }
        gst:           { type: number }
        total_amount:  { type: number }
        due_date:      { type: string, format: date }
        status:        { type: string, enum: [pending, paid, overdue, partially_paid] }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentOut" }

    MockPaymentDetails:
      type: object
      properties:
        mock_reference:
          type: string
          nullable: true
          description: "Mock UPI VPA, UTR, or cheque number. No real financial data."
        simulate_failure:
          type: boolean
          default: false
          description: "Set true to simulate a gateway failure (testing only)"
        simulate_timeout:
          type: boolean
          default: false
          description: "Set true to simulate a gateway timeout/interrupted payment (testing only)"

    PaymentCreate:
      type: object
      required: [bill_id, amount_paid, payment_method]
      properties:
        bill_id:        { type: string }
        amount_paid:    { type: number, minimum: 0, exclusiveMinimum: true }
        payment_method: { type: string, enum: [upi, online_transfer, cheque, cash] }
        gateway:        { $ref: "#/components/schemas/MockPaymentDetails" }

    PaymentOut:
      type: object
      properties:
        payment_id:      { type: string }
        bill_id:         { type: string }
        resident_id:     { type: string }
        amount_paid:     { type: number }
        payment_method:  { type: string, enum: [upi, online_transfer, cheque, cash] }
        paid_on:         { type: string, format: date-time }
        receipt_no:      { type: string, example: "PAY-20240315-A1B2C3D4" }
        transaction_ref: { type: string, nullable: true }
        status:          { type: string, enum: [pending, paid, failed, cancelled, refunded] }
        gateway_message: { type: string, nullable: true }

    PaymentReceipt:
      type: object
      properties:
        payment_id:      { type: string }
        receipt_no:      { type: string, example: "PAY-20240315-A1B2C3D4" }
        transaction_ref: { type: string }
        bill_id:         { type: string }
        resident_id:     { type: string }
        billing_month:   { type: string }
        amount_paid:     { type: number }
        payment_method:  { type: string, enum: [upi, online_transfer, cheque, cash] }
        paid_on:         { type: string, format: date-time }
        status:          { type: string, enum: [pending, paid, failed, cancelled, refunded] }
        gateway_message: { type: string }

    ErrorDetail:
      type: object
      properties:
        detail: { type: string }
