openapi: 3.0.3
info:
  title: Complaint Statistics API — BE-07
  description: >
    Complaint Statistics API for Jains Kences Retreat Apartment Association
    Management System. Serves the Association President's dashboard with the
    headline complaint counts and the trend series the charts are drawn from.

    Counts are derived entirely from Complaint.status — no separate stats
    table is maintained, so the numbers can never drift from the complaint
    records themselves. The five workflow statuses are grouped into three
    dashboard buckets:
      pending   = submitted
      ongoing   = assigned + in_progress
      completed = resolved + closed

    Trend data returns one point per calendar month for the requested window
    (default 6 months, inclusive of the current month), each with the number
    of complaints raised and the number resolved. "Raised" is bucketed by
    created_at. "Resolved" is bucketed by the audit-trail entry (BE-16) that
    first moved the complaint into resolved/closed, falling back to
    updated_at for complaints that reached a completed status without going
    through the progress endpoint. Months with no activity are still returned
    with zero counts so charts keep a continuous x-axis.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

tags:
  - name: Complaints
    description: Dashboard statistics derived from complaint records

paths:

  /complaints/stats:
    get:
      tags: [Complaints]
      summary: Complaint dashboard statistics
      description: >
        Returns pending / ongoing / completed counts, the raw per-status
        breakdown, a category distribution sorted busiest-first, and a
        month-by-month trend series.

        Always returns 200 — an empty database yields zeroed counts and an
        all-zero trend series rather than a 404, so the dashboard renders
        correctly on day one.
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
          description: >
            How many calendar months of trend data to return, counting back
            from and including the current month. Values outside 1–24 are
            rejected with 422.
      responses:
        "200":
          description: Statistics returned successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintStatsOut" }
              example:
                pending: 4
                ongoing: 7
                completed: 23
                total: 34
                by_status:
                  submitted: 4
                  assigned: 3
                  in_progress: 4
                  resolved: 9
                  closed: 14
                by_category:
                  - { category: "plumbing",         count: 12 }
                  - { category: "electrical",       count: 9 }
                  - { category: "water_supply",     count: 6 }
                  - { category: "lift_maintenance", count: 4 }
                  - { category: "security",         count: 3 }
                trend:
                  - { period: "2026-03", label: "Mar 2026", raised: 5, resolved: 4, avg_resolution_hours: 41.5 }
                  - { period: "2026-04", label: "Apr 2026", raised: 7, resolved: 6, avg_resolution_hours: 38.2 }
                  - { period: "2026-05", label: "May 2026", raised: 4, resolved: 5, avg_resolution_hours: 52.0 }
                  - { period: "2026-06", label: "Jun 2026", raised: 8, resolved: 6, avg_resolution_hours: 33.9 }
                  - { period: "2026-07", label: "Jul 2026", raised: 6, resolved: 2, avg_resolution_hours: 60.7 }
                  - { period: "2026-08", label: "Aug 2026", raised: 4, resolved: 0, avg_resolution_hours: null }
                avg_resolution_hours: 42.6
                resolved_sample_size: 23
                trend_months: 6
                generated_at: "2026-08-01T09:30:00Z"
        "422":
          description: Validation error — `months` outside the allowed 1–24 range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPValidationError" }
              example:
                detail:
                  - loc: ["query", "months"]
                    msg: "Input should be less than or equal to 24"
                    type: "less_than_equal"

components:
  schemas:

    ComplaintStatsOut:
      type: object
      required: [pending, ongoing, completed, total, by_status, trend_months, generated_at]
      properties:
        pending:
          type: integer
          minimum: 0
          description: "Complaints not yet assigned (status = submitted)"
        ongoing:
          type: integer
          minimum: 0
          description: "Complaints being worked on (status = assigned or in_progress)"
        completed:
          type: integer
          minimum: 0
          description: "Complaints finished (status = resolved or closed)"
        total:
          type: integer
          minimum: 0
          description: "All complaints on record — equals pending + ongoing + completed"
        by_status:
          $ref: "#/components/schemas/ComplaintStatusCounts"
        by_category:
          type: array
          description: "Category distribution, busiest category first"
          items: { $ref: "#/components/schemas/CategoryCount" }
        trend:
          type: array
          description: "One point per calendar month, oldest first, current month last"
          items: { $ref: "#/components/schemas/TrendPoint" }
        avg_resolution_hours:
          type: number
          minimum: 0
          nullable: true
          description: >
            Average hours from creation to resolution across every resolved or
            closed complaint on record (all-time). Null when nothing has been
            resolved yet.
        resolved_sample_size:
          type: integer
          minimum: 0
          description: "How many resolved/closed complaints the average is based on"
        trend_months:
          type: integer
          description: "Number of months covered by `trend` (echoes the `months` parameter)"
        generated_at:
          type: string
          format: date-time
          description: "UTC timestamp this snapshot was computed"

    ComplaintStatusCounts:
      type: object
      description: "Raw per-status counts, before grouping into dashboard buckets"
      properties:
        submitted:   { type: integer, minimum: 0 }
        assigned:    { type: integer, minimum: 0 }
        in_progress: { type: integer, minimum: 0 }
        resolved:    { type: integer, minimum: 0 }
        closed:      { type: integer, minimum: 0 }

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
          description: "e.g. plumbing, electrical, security, water_supply, lift_maintenance"
        count:
          type: integer
          minimum: 0

    TrendPoint:
      type: object
      required: [period, label, raised, resolved]
      properties:
        period:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          description: "Month in YYYY-MM form, e.g. '2026-07'"
        label:
          type: string
          description: "Human-readable month label for the chart axis, e.g. 'Jul 2026'"
        raised:
          type: integer
          minimum: 0
          description: "Complaints created in this month"
        resolved:
          type: integer
          minimum: 0
          description: "Complaints that reached resolved/closed in this month"
        avg_resolution_hours:
          type: number
          minimum: 0
          nullable: true
          description: >
            Average hours from creation to resolution for complaints resolved in
            this month. Null when no complaint was resolved this month (an empty
            month is null, never 0).

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items: { $ref: "#/components/schemas/ValidationError" }

    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items: { type: string }
        msg:  { type: string }
        type: { type: string }
