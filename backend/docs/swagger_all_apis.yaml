      summary: Broadcast an emergency alert
      operationId: broadcast_emergency_alert_api_v1_alerts_emergency_post
      x-backlog-id: BE-19
      description: 'Broadcasts an emergency alert to every active resident and logs a delivery record
        for each one.


        **Recipients** are all residents with status `active`. Residents who are `inactive` or `moved_out`
        are excluded. Pass `target_block` to scope the broadcast to a single block/tower; omit it to reach
        the whole society.


        **Delivery status is recorded per recipient** in the returned `deliveries` list — `sent` with
        a timestamp, or `failed` with a reason (for example, no phone number on record). A recipient the
        notifier cannot reach does not fail the broadcast: the remaining residents are still notified
        and the misses are recorded so someone can follow up in person. The `sent_count` / `failed_count`
        totals roll those rows up.


        The whole broadcast is one transaction — either the alert and its full delivery log are written,
        or neither is.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyAlertCreate'
        required: true
      responses:
        '201':
          description: Alert broadcast and delivery logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOut'
        '400':
          description: Unknown target block, or no active residents to notify
        '422':
          description: Validation error (missing title, message under 10 characters)
