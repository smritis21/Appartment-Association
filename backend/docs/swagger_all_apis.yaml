        route:
          anyOf:
          - type: string
          - type: 'null'
          title: Route
          description: Default client-side path for `destination`, provided as a convenience. Always a
            route that exists in the reference app.
        missing:
          items:
            type: string
          type: array
          title: Missing
          default: []
        suggestions:
          items:
            type: string
          type: array
          title: Suggestions
          default: []
        source:
          type: string
          enum:
          - rules
          - llm
          title: Source
          description: Which path produced the reply text
          default: rules
