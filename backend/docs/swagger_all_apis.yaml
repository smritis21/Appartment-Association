openapi: 3.1.0
info:
  title: Jains Kences Retreat — Apartment Association Management System API
  version: 1.0.0
  description: 'Consolidated OpenAPI specification for every backend API delivered across Milestones 3
    and 4 of the Jains Kences Retreat Apartment Association Management System (backlog items BE-01 to
    BE-42).


    Operations carry an `x-backlog-id` and, where recorded, an `x-user-story` field so each endpoint traces
    back to the backlog item it implements. Paths, parameters and schemas are taken from the running FastAPI
    application, so this document cannot drift from the implementation.


    Error model: every failure returns a JSON object with a `detail` field. Schema validation failures
    return 422, except on POST /complaints and PUT /complaints/{id}/status where BE-01 and BE-02 require
    400.'
  contact:
    name: Team MAY2026-Team-071
servers:
- url: http://localhost:8000/api/v1
  description: Local development server
tags:
- name: Onboarding
- name: Residents
- name: Directory
- name: Payments & Billing
- name: Authentication
- name: Announcements
- name: Notifications
- name: Complaints
- name: Visitors
- name: Staff
- name: Workforce
- name: Maintenance
- name: Payment Reminders
- name: Alerts
- name: Events
- name: Facilities
- name: Marketplace
- name: AI Analytics
- name: AI Assistant
- name: Community
- name: Temple
- name: Audit
- name: Reports
- name: Settings
- name: Documents
- name: Communication
- name: Forum & Lost-and-Found
paths:
  /onboarding/register:
    post:
      tags:
      - Onboarding
      summary: Submit an onboarding registration
      operationId: register_api_v1_onboarding_register_post
      x-backlog-id: BE-22
      description: Creates a new onboarding application with `status = pending`. Duplicate active applications
        for the same email are rejected with 409.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRegister'
        required: true
      responses:
        '201':
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '409':
          description: Active application already exists for this email
        '422':
          description: Validation error
  /onboarding/upload-document:
    post:
      tags:
      - Onboarding
      summary: Upload a KYC / supporting document
      operationId: upload_document_api_v1_onboarding_upload_document_post
      x-backlog-id: BE-22
      description: Attaches a document reference to an existing pending application. No binary data is
        stored — supply a file path, URL, or object-storage key.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
        required: true
      responses:
        '201':
          description: Document recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__schemas__onboarding__DocumentOut'
        '400':
          description: Application is not in pending status
        '404':
          description: Application not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /onboarding/status/{application_id}:
    get:
      tags:
      - Onboarding
      summary: Get application status
      operationId: get_status_api_v1_onboarding_status__application_id__get
      x-backlog-id: BE-22
      description: Returns the current status and full detail of an application.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      responses:
        '200':
          description: Application returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '404':
          description: Application not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /onboarding/pending:
    get:
      tags:
      - Onboarding
      summary: List pending applications
      operationId: list_pending_api_v1_onboarding_pending_get
      x-backlog-id: BE-22
      description: Returns all applications awaiting review, oldest first.
      responses:
        '200':
          description: Pending applications returned
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApplicationSummary'
                type: array
                title: Response List Pending Api V1 Onboarding Pending Get
        '401':
          description: Authentication required
        '403':
          description: Insufficient role
      security:
      - HTTPBearer: []
  /onboarding/{application_id}:
    get:
      tags:
      - Onboarding
      summary: Get application detail
      operationId: get_application_api_v1_onboarding__application_id__get
      x-backlog-id: BE-22
      description: Returns full application detail including uploaded documents.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      responses:
        '200':
          description: Application returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role
        '404':
          description: Application not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /onboarding/{application_id}/approve:
    put:
      tags:
      - Onboarding
      summary: Approve an application
      operationId: approve_api_v1_onboarding__application_id__approve_put
      x-backlog-id: BE-22
      description: Approves a pending application. Creates the Resident record (BE-18), activates the
        linked User account (BE-21), and writes an audit log entry. Only pending applications can be approved.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveApplication'
      responses:
        '200':
          description: Application approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role
        '404':
          description: Application or flat not found
        '409':
          description: Application is not pending
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /onboarding/{application_id}/reject:
    put:
      tags:
      - Onboarding
      summary: Reject an application
      operationId: reject_api_v1_onboarding__application_id__reject_put
      x-backlog-id: BE-22
      description: Rejects a pending application with a mandatory reason. No Resident or User is created.
        Writes an audit log entry.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectApplication'
      responses:
        '200':
          description: Application rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Authentication required
        '403':
          description: Insufficient role
        '404':
          description: Application not found
        '409':
          description: Application is not pending
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /residents:
    get:
      tags:
      - Residents
      summary: List all residents
      operationId: list_residents_api_v1_residents_get
      x-backlog-id: BE-18
      description: 'Returns a paginated list of residents. Optionally filter by status: `active`, `inactive`,
        or `moved_out`.'
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of records to skip
          default: 0
          title: Skip
        description: Number of records to skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max records to return (capped at 100)
          default: 20
          title: Limit
        description: Max records to return (capped at 100)
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by status: active / inactive / moved_out'
          title: Status
        description: 'Filter by status: active / inactive / moved_out'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResidentSummary'
                title: Response List Residents Api V1 Residents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Residents
      summary: Create a new resident
      operationId: create_resident_api_v1_residents_post
      x-backlog-id: BE-18
      description: Creates a resident and optionally their family members and emergency contacts. The
        referenced `flat_id` must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentCreate'
      responses:
        '201':
          description: Resident created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentOut'
        '404':
          description: Flat not found
        '422':
          description: Validation error
  /residents/search:
    get:
      tags:
      - Residents
      summary: Search residents
      operationId: search_residents_api_v1_residents_search_get
      x-backlog-id: BE-18
      description: Case-insensitive search across resident name and phone number.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          description: Search term (name or phone)
          title: Q
        description: Search term (name or phone)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max records to return (capped at 100)
          default: 20
          title: Limit
        description: Max records to return (capped at 100)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResidentSummary'
                title: Response Search Residents Api V1 Residents Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /residents/{resident_id}/complaints:
    get:
      tags:
      - Residents
      summary: Get resident complaint history
      operationId: get_resident_complaints_api_v1_residents__resident_id__complaints_get
      x-backlog-id: BE-10
      description: 'Returns the resident''s complaint history newest first (ties broken by complaint_id so
        ordering is stable across pages). Resolved and closed complaints remain accessible. By default the
        full history is returned; pass page and/or page_size to page through a long history, with the total,
        page, page size, and page count returned in the X-Total-Count, X-Page, X-Page-Size, and
        X-Total-Pages response headers. A page past the end is an empty array, not a 404.'
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Page
        description: 1-based page number. Omit for the full history.
      - name: page_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 100
          - type: 'null'
          title: Page Size
        description: Items per page (1-100). Defaults to 20 when only page is given.
      responses:
        '200':
          description: Complaint history (a page of it when paginated)
          headers:
            X-Total-Count:
              description: Total complaints in this resident's history.
              schema: { type: integer }
            X-Page:
              description: The page returned (paginated requests only).
              schema: { type: integer }
            X-Page-Size:
              description: The page size applied (paginated requests only).
              schema: { type: integer }
            X-Total-Pages:
              description: Total number of pages (paginated requests only).
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintOut'
                title: Response Get Resident Complaints Api V1 Residents  Resident Id  Complaints Get
        '404':
          description: Resident not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /residents/{resident_id}:
    get:
      tags:
      - Residents
      summary: Get resident by ID
      operationId: get_resident_api_v1_residents__resident_id__get
      x-backlog-id: BE-18
      description: Returns full resident profile including flat, family members, and emergency contacts.
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentOut'
        '404':
          description: Resident not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Residents
      summary: Update a resident
      operationId: update_resident_api_v1_residents__resident_id__put
      x-backlog-id: BE-18
      description: Partially updates a resident record. Only fields provided in the request body are updated.
        Setting status to `moved_out` automatically records today as `move_out_date` if not provided.
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentUpdate'
      responses:
        '200':
          description: Resident updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentOut'
        '404':
          description: Resident or flat not found
        '422':
          description: Validation error
    delete:
      tags:
      - Residents
      summary: Deactivate a resident (soft delete)
      operationId: delete_resident_api_v1_residents__resident_id__delete
      x-backlog-id: BE-18
      description: Sets the resident's status to `inactive`. The record is retained for audit and billing
        history. This is a soft delete — the row is never permanently removed.
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      responses:
        '200':
          description: Resident deactivated successfully
          content:
            application/json:
              schema: {}
        '404':
          description: Resident not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /directory:
    get:
      tags:
      - Directory
      summary: Directory overview
      operationId: get_overview_api_v1_directory_get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Returns flat counts, resident counts, and the list of blocks in the society.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryOverview'
      security:
      - HTTPBearer: []
  /directory/residents:
    get:
      tags:
      - Directory
      summary: List residents
      operationId: list_residents_api_v1_directory_residents_get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Paginated resident list. Filter by `status`, `block`, or `resident_type` (owner / tenant).
        Phone numbers are masked for non-management roles viewing other residents.
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Records to skip
          default: 0
          title: Skip
        description: Records to skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max records to return
          default: 20
          title: Limit
        description: Max records to return
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by status: active / inactive / moved_out'
          title: Status
        description: 'Filter by status: active / inactive / moved_out'
      - name: block
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by block/wing, e.g. 'A'
          title: Block
        description: Filter by block/wing, e.g. 'A'
      - name: resident_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by type: owner / tenant'
          title: Resident Type
        description: 'Filter by type: owner / tenant'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResidentSummary'
                title: Response List Residents Api V1 Directory Residents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /directory/residents/{resident_id}:
    get:
      tags:
      - Directory
      summary: Get resident profile
      operationId: get_resident_api_v1_directory_residents__resident_id__get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Returns full resident profile including flat, family members, and emergency contacts.
        Phone and emergency contacts are masked/hidden for non-management roles viewing other residents.
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentOut'
        '404':
          description: Resident not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /directory/flats:
    get:
      tags:
      - Directory
      summary: List flats
      operationId: list_flats_api_v1_directory_flats_get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Paginated flat list with optional filters for block, ownership type, and occupancy
        status. Each flat includes its active residents.
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Records to skip
          default: 0
          title: Skip
        description: Records to skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Max records to return
          default: 20
          title: Limit
        description: Max records to return
      - name: block
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by block/wing
          title: Block
        description: Filter by block/wing
      - name: ownership_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by ownership: owned / rented'
          title: Ownership Type
        description: 'Filter by ownership: owned / rented'
      - name: occupancy_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by occupancy: occupied / vacant'
          title: Occupancy Status
        description: 'Filter by occupancy: occupied / vacant'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryFlatOut'
                title: Response List Flats Api V1 Directory Flats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /directory/flats/{flat_id}:
    get:
      tags:
      - Directory
      summary: Get flat detail
      operationId: get_flat_api_v1_directory_flats__flat_id__get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Returns flat details including all active residents.
      parameters:
      - name: flat_id
        in: path
        required: true
        schema:
          type: string
          title: Flat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryFlatOut'
        '404':
          description: Flat not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /directory/household/{resident_id}:
    get:
      tags:
      - Directory
      summary: Get household members
      operationId: get_household_api_v1_directory_household__resident_id__get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Returns the family members registered under a resident.
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMemberOut'
                title: Response Get Household Api V1 Directory Household  Resident Id  Get
        '404':
          description: Resident not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /directory/emergency-contacts/{resident_id}:
    get:
      tags:
      - Directory
      summary: Get emergency contacts
      operationId: get_emergency_contacts_api_v1_directory_emergency_contacts__resident_id__get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Returns emergency contacts for a resident. Only accessible by the resident themselves
        or management roles (admin, president, secretary).
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: string
          title: Resident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmergencyContactOut'
                title: Response Get Emergency Contacts Api V1 Directory Emergency Contacts  Resident Id  Get
        '403':
          description: Insufficient permissions
        '404':
          description: Resident not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /directory/search:
    get:
      tags:
      - Directory
      summary: Search directory
      operationId: search_api_v1_directory_search_get
      x-backlog-id: BE-23
      x-user-story: As a resident, I want a searchable directory of residents and flats, so that I can
        find a neighbour or a flat's details without asking the office.
      description: Searches residents (by name/phone) and flats (by block/flat number) in a single call.
        Minimum 2 characters required.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          description: Search term
          title: Q
        description: Search term
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
