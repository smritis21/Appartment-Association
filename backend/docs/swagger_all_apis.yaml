      description: 'Stores a resident''s star rating (1–5) and optional comment for a complaint.


        **Feedback is only accepted for resolved or closed complaints, and only within the feedback window**
        — 7 days from the date the complaint was resolved. The window is measured from the audit-trail
        entry that moved the complaint into resolved/closed (BE-16), not from the record''s last-modified
        time, so an unrelated edit cannot extend or reset it.


        **Feedback is one-shot.** A complaint can be rated once; a second submission returns 409. This
        is enforced by a UNIQUE constraint on the database as well as the service check, so concurrent
        submissions cannot both succeed.


        A comment is optional — requiring prose to leave a star rating only suppresses the response rate.
        Whitespace-only comments are stored as null rather than blank text.'
      parameters:
      - name: complaint_id
        in: path
        required: true
        schema:
          type: string
          title: Complaint Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
