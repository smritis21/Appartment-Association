      required:
      - kind
      - text
      title: ChatReply
      description: "One assistant turn.\n\n`kind` tells the client how to render it:\n  answer      —\
        \ a direct response, nothing to confirm\n  proposal    — an action is waiting; show `action` and\
        \ a confirm button\n  needs_input — a slot is missing; `missing` lists what to ask for\n  refusal\
        \     — the caller's role may not run what they asked for\n  navigate    — push `route`; the user\
        \ asked to be taken somewhere\n  fallback    — not understood; `suggestions` offers a way forward"
