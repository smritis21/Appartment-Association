            - found
            type: string
          - type: 'null'
          description: 'Filter: lost | found'
          title: Item Type
        description: 'Filter: lost | found'
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - open
            - resolved
            type: string
          - type: 'null'
          description: 'Filter: open | resolved'
          title: Status
        description: 'Filter: open | resolved'
