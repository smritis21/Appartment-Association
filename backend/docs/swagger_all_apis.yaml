      summary: List lost and found items
      operationId: list_lost_found_items_api_v1_forum_lost_found_get
      x-backlog-id: BE-29
      description: Returns a paginated list of lost/found items, newest first. Optionally filter by `item_type`
        (lost | found) and/or `status` (open | resolved).
      parameters:
      - name: item_type
        in: query
        required: false
        schema:
