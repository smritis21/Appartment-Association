[pytest]
# Silence a deprecation raised inside python-jose, not in this project.
#
# jose/jwt.py:311 calls datetime.utcnow(), which Python 3.12 deprecates. Every
# authenticated test decodes a token, so the single library call produced
# hundreds of identical warnings and buried anything genuinely worth reading.
# The project's own call sites were all migrated to
# datetime.now(timezone.utc).replace(tzinfo=None); this filter is scoped to the
# jose module alone so a future deprecation in our code still shows up.
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:jose.jwt

# asyncio_mode is set explicitly to silence the pytest-asyncio unset-default
# warning and to pin the behaviour the suite already relies on.
asyncio_default_fixture_loop_scope = function
