<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Jains Kences Retreat: Apartment Association Management System" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#ece8dc"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <!-- soft sage rings, like the app's page backdrop -->
    <circle cx="1090" cy="40" r="210" fill="none" stroke="#dde7d9" stroke-width="38"/>
    <circle cx="60" cy="320" r="150" fill="#e4ecdf" opacity="0.8"/>

    <!-- left: title block -->
    <rect x="70" y="62" width="268" height="28" rx="14" fill="#dde7d9"/>
    <text x="86" y="81" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2a4a32" letter-spacing="0.6">COMMUNITY SERVICES PLATFORM · TEAM 71</text>
    <text x="68" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1f3a28">Jains Kences Retreat</text>
    <text x="70" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#3f6b4a">Apartment Association Management System</text>
    <text x="70" y="238" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6b7a6e">Complaints · Visitors · Billing · Community · AI assistant</text>

    <!-- right: tiny dashboard mock -->
    <g transform="translate(790 48)">
      <rect x="0" y="0" width="340" height="204" rx="16" fill="#fbfaf5" stroke="#d9e2d4" stroke-width="1.5"/>
      <rect x="0" y="0" width="340" height="34" rx="16" fill="#ffffff"/>
      <rect x="0" y="20" width="340" height="14" fill="#ffffff"/>
      <circle cx="22" cy="17" r="5" fill="#d9e2d4"/><circle cx="40" cy="17" r="5" fill="#d9e2d4"/><circle cx="58" cy="17" r="5" fill="#d9e2d4"/>
      <circle cx="312" cy="17" r="10" fill="#2a4a32"/>

      <!-- stat cards -->
      <rect x="16" y="50" width="94" height="52" rx="10" fill="#ffffff" stroke="#e3eadf"/>
      <rect x="120" y="50" width="94" height="52" rx="10" fill="#ffffff" stroke="#e3eadf"/>
      <rect x="224" y="50" width="100" height="52" rx="10" fill="#ffffff" stroke="#e3eadf"/>
      <circle cx="34" cy="76" r="10" fill="#dde7d9"/><circle cx="138" cy="76" r="10" fill="#fbeccd"/><circle cx="242" cy="76" r="10" fill="#dde7d9"/>
      <rect x="52" y="66" width="40" height="7" rx="3.5" fill="#cfd9ca"/><rect x="52" y="80" width="26" height="9" rx="4" fill="#2a4a32"/>
      <rect x="156" y="66" width="40" height="7" rx="3.5" fill="#cfd9ca"/><rect x="156" y="80" width="20" height="9" rx="4" fill="#c58a2b"/>
      <rect x="260" y="66" width="40" height="7" rx="3.5" fill="#cfd9ca"/><rect x="260" y="80" width="14" height="9" rx="4" fill="#2a4a32"/>

      <!-- list card -->
      <rect x="16" y="114" width="308" height="74" rx="10" fill="#ffffff" stroke="#e3eadf"/>
      <rect x="30" y="126" width="90" height="8" rx="4" fill="#2a4a32"/>
      <rect x="30" y="144" width="220" height="6" rx="3" fill="#e1e8dd"/>
      <rect x="30" y="158" width="180" height="6" rx="3" fill="#e1e8dd"/>
      <rect x="30" y="172" width="200" height="6" rx="3" fill="#e1e8dd"/>
      <rect x="252" y="124" width="58" height="22" rx="11" fill="#2a4a32"/>
      <rect x="264" y="132" width="34" height="6" rx="3" fill="#dde7d9"/>
    </g>
  </g>
</svg>
